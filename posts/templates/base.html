<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Linkup{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap"
        <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    rel="stylesheet">
    <style>
        h * {
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            margin: 0;
            background: #f3f5f8;
            color: #1f2937;
            min-height: 100vh;
        }

        nav {
            background: white;
            color: #1f2937;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        nav a {
            color: #4b5563;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            font-size: 15px;
        }

        nav a:hover {
            color: #2563eb;
        }

        .brand {
            font-family: "Pacifico", cursive;
            font-size: 30px;
            font-weight: 400;
            text-decoration: none;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        nav form {
            display: inline;
        }

        nav button {
            background: #f3f5f8;
            border: 1px solid #e5e7eb;
            color: #374151;
            cursor: pointer;
            font-size: 14px;
            margin-left: 20px;
            padding: 7px 16px;
            border-radius: 8px;
            font-family: inherit;
        }

        nav button:hover {
            background: #e5e7eb;
        }

        .container {
            max-width: 650px;
            margin: 28px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 9px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .btn-gray {
            background: #6b7280;
        }

        .btn-gray:hover {
            background: #4b5563;
        }

        input[type=text],
        input[type=password],
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-family: inherit;
            background: white;
        }

        input[type=text]:focus,
        input[type=password]:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .errorlist {
            color: #dc2626;
            padding-left: 18px;
        }

        .helptext {
            font-size: 12px;
            color: #6b7280;
        }

        .muted {
            color: #6b7280;
            font-size: 13px;
        }

        body {
            padding-bottom: 80px;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand {
            font-family: "Montserrat", "Segoe UI", Arial, sans-serif;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #0f2a43;
            text-decoration: none;
        }

        .brand:hover {
            text-decoration: none;
        }

        .top-links a {
            margin-left: 16px;
            font-weight: 500;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: center;
            gap: 56px;
            padding: 12px 0;
            z-index: 20;
        }

        .nav-icon {
            color: #374151;
            display: flex;
            align-items: center;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .nav-icon:hover {
            color: #2563eb;
        }

        .nav-icon svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div class="topbar">
        <a class="brand" href="{% url 'home' %}">Linkup</a>
        <div class="top-links">
            {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="nav-icon" title="Logout"><svg viewBox="0 0 24 24">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg></button>
            </form>
            {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% if user.is_authenticated %}
    <div class="bottom-nav">
        <a class="nav-icon" href="{% url 'home' %}" title="Home"><svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg></a>
        <a class="nav-icon" href="{% url 'search_users' %}" title="Search"><svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg></a>
        <a class="nav-icon" href="{% url 'create_post' %}" title="Create"><svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="4" />
                <line x1="12" y1="8" x2="12" y2="16" />
                <line x1="8" y1="12" x2="16" y2="12" />
            </svg></a>
        <a class="nav-icon" href="{% url 'profile' user.username %}" title="Profile">
            {% if user.profile.avatar %}
            <img class="nav-avatar" src="{{ user.profile.avatar.url }}" alt="">
            {% else %}
            <svg viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </svg>
            {% endif %}
        </a>
    </div>
    {% endif %}
</body>

</html>
