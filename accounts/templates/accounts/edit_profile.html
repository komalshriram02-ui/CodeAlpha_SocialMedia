{% extends "base.html" %}

{% block title %}Edit Profile - Connect{% endblock %}

{% block content %}
<div class="card">
    <h2>Edit Profile</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <p><label>Bio</label></p>
        <textarea name="bio" rows="3" maxlength="300"
            placeholder="Tell something about yourself...">{{ profile.bio }}</textarea>
        <p><label>Profile photo</label></p>
        <p><input type="file" name="avatar" accept="image/*"></p>
        <button type="submit" class="btn">Save</button>
        <a href="{% url 'profile' user.username %}" class="btn btn-gray">Cancel</a>
    </form>
</div>
{% endblock %}
