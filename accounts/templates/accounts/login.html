{% extends "base.html" %}

{% block title %}Login - Linkup{% endblock %}

{% block content %}
<div class="card">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Login</button>
    </form>
    <p class="muted">New here? <a href="{% url 'register' %}">Register</a></p>
</div>
{% endblock %}
